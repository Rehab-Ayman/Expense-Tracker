<section>
  <h2>Add Expense </h2>
  <p>All fields except the note are required</p>
  <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">

    <label for="amount">Amount:</label><br>
    <input type="number" formControlName="amount" id="amount" placeholder="0.00"><br>

    <label for="category">Category:</label>
    <select formControlName="category" id="category">
      <option value="">Pick a Category</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Shopping">Shopping</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select><br>


    <label for="date">Date:</label><br>
    <input type="date" formControlName="date" id="date"><br>

    <label for="note">Note:</label><br>
    <textarea formControlName="note" id="note" placeholder="What was it for"></textarea><br>
    <button type="submit">Add expense</button>
    <button type="reset">Cancel</button>

  </form>
</section>
